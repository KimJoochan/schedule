services:
  # 1. 루트 Node.js 웹 애플리케이션 (EJS / 프론트엔드 역할)
  web-app:
    container_name: node_web_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=your_password
      - DB_NAME=my_database
      - DB_PORT=3306
      - API_URL=http://api-back:4000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    depends_on:
      - db

  # 2. 하위 폴더의 TypeScript API 서버 (zion-qrcode-back)
  
  # api-back:
  #   container_name: node_api_back
  #   build:
  #     context: ./zion-qrcode-back
  #     dockerfile: Dockerfile
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     - NODE_ENV=development
  #     - DB_HOST=db
  #     - DB_USER=root
  #     - DB_PASSWORD=your_password
  #     - DB_NAME=my_database
  #     - DB_PORT=3306
  #   volumes:
  #     # 컨테이너 내부 경로를 /usr/src/api_app 으로 분리하여 충돌 방지
  #     - ./zion-qrcode-back:/usr/src/api_app
  #     - /usr/src/api_app/node_modules
  #     - /usr/src/api_app/dist
  #   restart: always
  #   depends_on:
  #     - db
  #   command: npm run dev

  # 3. MySQL 호환 MariaDB 10 컨테이너 설정
  db:
    image: mariadb:10.6
    container_name: mysql_10_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_DATABASE=my_database
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

# 로컬에 데이터를 보존하기 위한 가상 볼륨 정의
volumes:
  mysql_data: