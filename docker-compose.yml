# version: '3.8'

services:
  # 1. Node.js 애플리케이션 컨테이너 설정
  app:
    container_name: node_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db             # 하단의 DB 서비스명과 일치해야 연동됨
      - DB_USER=root
      - DB_PASSWORD=your_password
      - DB_NAME=my_database
      - DB_PORT=3306
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    depends_on:
      - db

  # 2. MySQL 호환 MariaDB 10 컨테이너 설정
  db:
    image: mariadb:10.6
    container_name: mysql_10_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_DATABASE=my_database
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

# 로컬에 데이터를 보존하기 위한 가상 볼륨 정의
volumes:
  mysql_data: